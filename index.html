<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>halbukemm</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #05000a; 
            color: white; 
        }
        
        canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
        }
        
        .glass-container {
            position: absolute; 
            z-index: 10; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            flex-direction: column; 
            transition: opacity 1s ease, visibility 1s; 
        }

        .glass-card {
            background: rgba(20, 0, 15, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 42, 95, 0.3);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            max-width: 420px;
            width: 85%;
            box-shadow: 0 8px 32px 0 rgba(255, 42, 95, 0.2);
            animation: float 6s ease-in-out infinite;
        }

        #login-section .glass-card {
            max-width: 350px;
            padding: 30px;
        }
        
        @keyframes float { 
            0% { transform: translateY(0px); } 
            50% { transform: translateY(-15px); } 
            100% { transform: translateY(0px); } 
        }

        h2.neon-title {
            margin-top: 0;
            color: #fff;
            text-shadow: 0 0 10px #ff2a5f, 0 0 20px #ff2a5f;
        }

        .key-input {
            width: 90%;
            padding: 12px 15px;
            margin: 10px 0 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #ff2a5f;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            text-align: center;
            box-shadow: inset 0 0 10px rgba(255, 42, 95, 0.2);
            box-sizing: border-box;
        }

        .key-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .glowing-btn { 
            padding: 12px 35px; 
            font-size: 1.1rem; 
            background: transparent; 
            color: #fff; 
            border: 2px solid #ff2a5f; 
            border-radius: 30px; 
            box-shadow: 0 0 15px #ff2a5f, inset 0 0 15px #ff2a5f; 
            cursor: pointer; 
            transition: 0.3s;
            margin: 5px;
        }
        
        .glowing-btn:hover {
            box-shadow: 0 0 30px #ff2a5f, inset 0 0 20px #ff2a5f; 
            text-shadow: 0 0 10px #fff;
        }

        #error-msg {
            color: #ff4772;
            font-size: 0.9rem;
            margin-top: 15px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #main-content {
            opacity: 0;
            visibility: hidden;
            z-index: 5;
        }

        .photo-frame {
            width: 220px;
            height: 220px;
            margin: 0 auto 25px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #ff2a5f;
            box-shadow: 0 0 25px rgba(255, 42, 95, 0.6);
            transition: transform 0.3s;
        }
        
        .photo-frame:hover {
            transform: scale(1.05);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        h1 { 
            margin: 0 0 15px; 
            font-size: 2.2rem; 
            background: -webkit-linear-gradient(#ff2a5f, #b829ff); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            letter-spacing: 1px;
        }
        
        p.message { 
            font-size: 1.15rem; 
            line-height: 1.7; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); 
            color: #e0e0e0;
        }

        #spotify-container {
            margin-top: 20px;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<!-- GİRİŞ EKRANI -->
<div id="login-section" class="glass-container">
    <div class="glass-card">
        <h2 class="neon-title">Özel Alan</h2>
        <p style="font-size: 0.95rem; color: #ccc;">Bu siteye girmek için doğru anahtarı girmelisin.</p>
        <input type="text" id="secret-key" class="key-input" placeholder="Anahtar Kelime..." onkeypress="handleEnter(event)">
        <button class="glowing-btn" onclick="checkKey()">Kilidi Aç 🗝️</button>
        <p id="error-msg">Hatalı anahtar, tekrar dene!</p>
    </div>
</div>

<!-- KUTLAMA İÇERİĞİ -->
<div id="main-content" class="glass-container">
    <div class="glass-card">
        <div class="photo-frame">
            <!-- FOTOĞRAF DOSYA ADI BURADA (foto.jpg yaptığından emin ol) -->
            <img src="foto.jpg" alt="Sevgilim">
        </div>
        <h1>İyi Ki Doğdun Sevgilim!</h1>
        <p class="message">Hayatıma girdiğin günden beri her şey çok daha güzel. Birlikte nice güzel yaşlara, seni çok seviyorum! ❤️</p>
        
        <!-- SPOTIFY GÖMÜLÜ ŞARKI LINKI -->
        <div id="spotify-container">
            <iframe src="https://open.spotify.com/embed/track/4cOdK2wGLETKBW3PvgPWqT?utm_source=generator&theme=0" width="100%" height="80" frameborder="0" allowtransparency="true" allow="encrypted-media"></iframe>
        </div>
    </div>
</div>

<script>
    function checkKey() {
        const keyInput = document.getElementById('secret-key').value.trim().toLowerCase();
        const errorMsg = document.getElementById('error-msg');
        
        // Şifre: halbukem aşkım
        if (keyInput === "halbukem aşkım") {
            const loginSection = document.getElementById('login-section');
            const mainContent = document.getElementById('main-content');
            
            loginSection.style.opacity = '0';
            setTimeout(() => {
                loginSection.style.visibility = 'hidden';
                mainContent.style.visibility = 'visible';
                mainContent.style.opacity = '1';
            }, 800);
            
        } else {
            errorMsg.style.opacity = '1';
            setTimeout(() => { errorMsg.style.opacity = '0'; }, 3000);
        }
    }

    function handleEnter(e) {
        if (e.key === 'Enter') {
            checkKey();
        }
    }

    // --- UÇUŞAN KALP ANİMASYONU ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let hearts = [];

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Heart {
        constructor() {
            this.reset();
            this.y = Math.random() * height; 
        }
        reset() {
            this.x = Math.random() * width;
            this.y = height + (Math.random() * 200 + 50); 
            this.size = Math.random() * 15 + 10;
            this.speed = Math.random() * 1.5 + 0.5;
            this.opacity = Math.random() * 0.5 + 0.2;
            this.sway = Math.random() * Math.PI * 2; 
        }
        update() {
            this.y -= this.speed;
            this.x += Math.sin(this.y * 0.01 + this.sway) * 0.8; 
            
            if (this.y < -50) {
                this.reset(); 
            }
        }
        draw() {
            ctx.save();
            ctx.font = this.size + 'px Arial';
            ctx.fillStyle = `rgba(255, 42, 95, ${this.opacity})`;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff2a5f';
            ctx.fillText('❤️', this.x, this.y);
            ctx.restore();
        }
    }

    for (let i = 0; i < 40; i++) {
        hearts.push(new Heart());
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        hearts.forEach(h => {
            h.update();
            h.draw();
        });

        requestAnimationFrame(animate);
    }
    animate();
</script>
</body>
</html>
